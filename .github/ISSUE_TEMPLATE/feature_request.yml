name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need rather than the solution. "I want to see…" or "It is hard to…".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
