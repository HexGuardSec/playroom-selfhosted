name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t playroom:ci .
      - name: Start in demo mode and check health
        run: |
          docker run -d --name playroom -e DEMO=true -p 8080:8080 --read-only --tmpfs /tmp --tmpfs /app/data:uid=1000,gid=1000 --cap-drop ALL playroom:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs playroom; exit 1
